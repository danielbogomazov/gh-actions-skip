name: Guard 'skip-coverage-check' label

on:
  pull_request:
    types: [labeled]

jobs:
  enforce-skip-coverage-label-permission:
    if: github.event.label.name == 'skip-coverage-check'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check if user is authorized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # Only these users can apply the 'skip-coverage-check' label
          AUTHORIZED_USERS=(
            "user1"
            "user2"
            "user3"
          )

          echo "Checking if user $ACTOR is authorized to apply the \`skip-coverage-check\` label."

          AUTHORIZED=false
          for user in "${AUTHORIZED_USERS[@]}"; do
            if [ "$ACTOR" = "$user" ]; then
              AUTHORIZED=true
              break
            fi
          done

          if [ "$AUTHORIZED" = "false" ]; then
            echo "::warning::User $ACTOR is not authorized to skip coverage checks. Removing label."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "skip-coverage-check"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "@$ACTOR is not authorized to apply the \`skip-coverage-check\` label. It has been removed. Please ask a team lead if you need coverage skipped."
            exit 0
          fi

          echo "User $ACTOR is authorized. Label will remain."