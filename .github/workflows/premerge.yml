name: Pre-merge

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    
jobs:
  guard-skip-coverage-label:
    # Only run the guard if the specific label was added
    if: github.event.action == 'labeled' && github.event.label.name == 'skip-coverage-check'
    runs-on: ubuntu-latest
    steps:
      - name: Check user authorization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          AUTHORIZED_USERS=("user1" "user2" "user3" "danielbogomazov")
          AUTHORIZED=false
          for user in "${AUTHORIZED_USERS[@]}"; do
            if [ "$ACTOR" = "$user" ]; then AUTHORIZED=true; break; fi
          done

          if [ "$AUTHORIZED" = "false" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "skip-coverage-check"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@$ACTOR is not authorized..."
            exit 1
          fi

  coverage-check:
    runs-on: ubuntu-latest
    # always() ensures this runs even if guard-skip-coverage-label was skipped (because label wasn't added)
    # but it will FAIL if guard-skip-coverage-label failed (because an unauthorized user added the label)
    if: |
      always() && 
      (needs.guard-skip-coverage-label.result == 'success' || needs.guard-skip-coverage-label.result == 'skipped')
    needs: [guard-skip-coverage-label]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prevent merge
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-coverage-check') }}
        run: |
          if [ -f "DO_NOT_MERGE.txt" ]; then
            echo "Blocking merge."
            exit 1
          fi
