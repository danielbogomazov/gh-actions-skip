name: Pre-merge

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    
jobs:
  guard-label:
    # Only run the guard if the specific label was added
    if: github.event.action == 'labeled' && github.event.label.name == 'skip-coverage-check'
    runs-on: ubuntu-latest
    steps:
      - name: Check user authorization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          AUTHORIZED_USERS=("user1" "user2" "user3", "danielbogomazov")
          AUTHORIZED=false
          for user in "${AUTHORIZED_USERS[@]}"; do
            if [ "$ACTOR" = "$user" ]; then AUTHORIZED=true; break; fi
          done

          if [ "$AUTHORIZED" = "false" ]; then
            echo "Unauthorized user. Removing label."
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "skip-coverage-check"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@$ACTOR is not authorized to apply the \`skip-coverage-check\` label."
          else
            echo "Authorized user. Label remains."
          fi
          # Always exit 0 so this job "succeeds"
          exit 0
 
  coverage-check:
    runs-on: ubuntu-latest
    # Wait for the guard job to finish its API calls
    needs: [guard-label]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check current labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fetch the FRESH list of labels from the API
          # This is safer than using github.event context because the guard job just changed them
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels.[].name')
          
          echo "Active labels: $CURRENT_LABELS"

          if echo "$CURRENT_LABELS" | grep -q "skip-coverage-check"; then
            echo "Coverage check skipped via authorized label."
          else
            if [ -f "DO_NOT_MERGE.txt" ]; then
              echo "DO_NOT_MERGE.txt found and no skip-label present. Blocking merge."
              exit 1
            fi
          fi
